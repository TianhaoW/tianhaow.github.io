</head><body><header id="top"><div class="wrap"><h1>《领导的“心事”》 · 演出台本</h1><div class="controls"><label for="role">我的角色</label><select id="role" aria-label="选择要突出台词的角色"><option value="A">A · 主角</option><option value="B">B · 同事（控场）</option><option value="C">C · 悲观派</option><option value="D">D · 乐观派</option><option value="E">E · 分析派</option><option value="ALL">全部角色（总览）</option></select><button type="button" id="minus" aria-label="缩小字号">A−</button><button type="button" id="plus" aria-label="放大字号">A＋</button><button type="button" id="mode">深色</button><button type="button" id="focus">仅看自己：关</button></div><nav class="scene-nav" id="scene-nav" aria-label="跳转到场次"></nav></div></header><main><p class="note" id="role-note">绿色：本人台词；浅色：他人接话。集体台词对五人都高亮。切换角色时保持当前位置；字号、角色和深色模式会记住。</p><div class="tips"><strong>开场：</strong>今天回顾昨天收到节目通知时发生的故事。<br><strong>忘词应急：</strong>B用“所以呢？”“你说重点！”把话题带回下一句。建议打开勿扰模式，并检查屏幕自动锁定。</div><div id="script"></div><a class="top-link" href="#top">↑ 返回顶部</a><footer>静态单文件 · 不依赖外部资源 · 适用于 GitHub Pages</footer></main>
<script>
'use strict';
const SCENES=[{"title": "第一场｜新员工的消息恐惧症 · 约2分钟", "lines": [{"role": "B", "group": false, "action": "〔面向观众，自然开场〕", "text": "各位领导、各位同事，大家好！我们几个刚入职，今天给大家讲一件昨天收到节目通知时发生的真事。"}, {"role": "A", "group": false, "action": "〔举起手机〕", "text": "也不完全是真事。"}, {"role": "B", "group": false, "action": "", "text": "怎么不真？"}, {"role": "A", "group": false, "action": "", "text": "我那天没这么镇定。"}, {"role": "B", "group": false, "action": "", "text": "你现在也没镇定！"}, {"role": "B", "group": false, "action": "", "text": "新员工刚入职，最重要的是什么？"}, {"role": "A", "group": false, "action": "", "text": "熟悉环境、了解业务、快速融入团队。"}, {"role": "B", "group": false, "action": "", "text": "挺好啊。"}, {"role": "A", "group": false, "action": "", "text": "所以我手机里存了园区地图、食堂菜单、班车时间、入职手册、会议室预约指南……"}, {"role": "B", "group": false, "action": "", "text": "准备得很充分。"}, {"role": "A", "group": false, "action": "", "text": "还有一份《领导消息回复模板大全》。"}, {"role": "B", "group": false, "action": "", "text": "这是什么东西？"}, {"role": "A", "group": false, "action": "", "text": "以防万一。"}, {"role": "B", "group": false, "action": "", "text": "能有什么万一？"}, {"role": "A", "group": false, "action": "〔停一秒，抬头〕", "text": "【看手机，突然僵住】……万一来了。"}, {"role": "B", "group": false, "action": "", "text": "怎么了？"}, {"role": "A", "group": false, "action": "", "text": "领导给我发消息了。"}, {"role": "B", "group": false, "action": "", "text": "你回啊！"}, {"role": "A", "group": false, "action": "〔手机对观众展示姿态，不要求屏幕真能看到〕", "text": "只有两个字——“在吗？”"}, {"role": "C", "group": false, "action": "〔从左侧探头，压低声音〕", "text": "坏了！"}, {"role": "D", "group": false, "action": "〔兴奋〕", "text": "机会来了！"}, {"role": "E", "group": false, "action": "〔认真翻手机〕", "text": "先别动，需要分析。"}, {"role": "B", "group": false, "action": "", "text": "等会儿！这仨谁啊？"}, {"role": "A", "group": false, "action": "", "text": "我脑海里的三个声音。"}, {"role": "B", "group": false, "action": "", "text": "你的脑海还挺有编制！"}, {"role": "C", "group": false, "action": "", "text": "我是风险预警。"}, {"role": "D", "group": false, "action": "", "text": "我是积极进取。"}, {"role": "E", "group": false, "action": "", "text": "我是智能决策。"}, {"role": "B", "group": false, "action": "〔面向观众〕", "text": "好家伙，你脑子里开了个项目组。"}]}, {"title": "第二场｜两个字的三种解读 · 约3分钟", "lines": [{"role": "B", "group": false, "action": "", "text": "领导问在不在，最简单不就是回一句“在”吗？"}, {"role": "C", "group": false, "action": "", "text": "不行！领导为什么突然问你在不在？一定有事。"}, {"role": "A", "group": false, "action": "", "text": "什么事？"}, {"role": "C", "group": false, "action": "", "text": "先查昨天考勤。你几点进园区？"}, {"role": "A", "group": false, "action": "", "text": "八点半。"}, {"role": "C", "group": false, "action": "", "text": "几点到工位？"}, {"role": "A", "group": false, "action": "", "text": "八点四十五。"}, {"role": "C", "group": false, "action": "", "text": "中间十五分钟呢？"}, {"role": "A", "group": false, "action": "", "text": "吃早饭啊。"}, {"role": "C", "group": false, "action": "", "text": "你看！这就是问题！"}, {"role": "B", "group": false, "action": "", "text": "吃个早饭能有什么问题？"}, {"role": "C", "group": false, "action": "", "text": "领导万一问：你这碗面，是工作餐还是生活餐？"}, {"role": "B", "group": false, "action": "", "text": "你先别替食堂成立调查组。"}, {"role": "D", "group": false, "action": "", "text": "我反对！领导主动找人，说明受到重视。"}, {"role": "A", "group": false, "action": "", "text": "真的？"}, {"role": "D", "group": false, "action": "", "text": "公司这么多人，为什么偏偏找你？"}, {"role": "B", "group": false, "action": "", "text": "可能通讯录刚好翻到他。"}, {"role": "D", "group": false, "action": "", "text": "这叫人才识别！"}, {"role": "B", "group": false, "action": "", "text": "他才入职几天，识别出什么？"}, {"role": "D", "group": false, "action": "", "text": "成长空间！"}, {"role": "B", "group": false, "action": "〔停半秒〕", "text": "那倒是，现在基本全是空间。"}, {"role": "E", "group": false, "action": "", "text": "都不严谨。我们应该从信息本身入手。"}, {"role": "A", "group": false, "action": "", "text": "你怎么看？"}, {"role": "E", "group": false, "action": "", "text": "第一，“在吗”只有两个汉字，表明领导追求沟通效率。"}, {"role": "B", "group": false, "action": "", "text": "那不就两个字吗？"}, {"role": "E", "group": false, "action": "", "text": "第二，句末是问号，表明领导需要得到确认。"}, {"role": "B", "group": false, "action": "", "text": "他总不能打感叹号吧！"}, {"role": "E", "group": false, "action": "", "text": "第三，我又对比了三种可能：“在吗”“在不在”“方便聊两句吗”。"}, {"role": "A", "group": false, "action": "", "text": "结论呢？"}, {"role": "E", "group": false, "action": "〔郑重宣布〕", "text": "领导很可能想知道——你在不在。"}, {"role": "B", "group": false, "action": "", "text": "你这个分析，把字都分析回去了！"}, {"role": "C", "group": false, "action": "", "text": "注意！他发消息时，你正在干什么？"}, {"role": "A", "group": false, "action": "", "text": "在看培训材料。"}, {"role": "C", "group": false, "action": "", "text": "有没有划水？"}, {"role": "A", "group": false, "action": "", "text": "没有！"}, {"role": "D", "group": false, "action": "", "text": "那更证明领导要表扬你。"}, {"role": "E", "group": false, "action": "", "text": "缺少证据。建议获取更多样本。"}, {"role": "B", "group": false, "action": "", "text": "你们别争了。现在最重要的是——"}, {"role": "A", "group": false, "action": "", "text": "怎么回？"}, {"role": "B", "group": false, "action": "", "text": "终于问到点上了。"}]}, {"title": "第三场｜回复领导是一门学问 · 约3分钟", "lines": [{"role": "A", "group": false, "action": "〔低头打字〕", "text": "我回个“在”。"}, {"role": "C", "group": false, "action": "", "text": "太生硬！"}, {"role": "A", "group": false, "action": "", "text": "“在的”。"}, {"role": "D", "group": false, "action": "", "text": "太被动！"}, {"role": "A", "group": false, "action": "", "text": "“领导您好，我在。”"}, {"role": "C", "group": false, "action": "", "text": "不够慎重。"}, {"role": "D", "group": false, "action": "", "text": "不够积极。"}, {"role": "E", "group": false, "action": "", "text": "不够结构化。"}, {"role": "B", "group": false, "action": "", "text": "你们这是回微信还是审核公文啊？"}, {"role": "A", "group": false, "action": "", "text": "那你们一个个说。"}, {"role": "C", "group": false, "action": "", "text": "“领导您好，非常抱歉现在才看到消息，如有不足请批评指正。”"}, {"role": "B", "group": false, "action": "", "text": "领导还没批评，你先认错了？"}, {"role": "D", "group": false, "action": "", "text": "我来：“领导您好！非常荣幸收到您的消息！我已做好迎接新挑战的准备！”"}, {"role": "B", "group": false, "action": "", "text": "你是准备上岗，还是准备发射？"}, {"role": "E", "group": false, "action": "", "text": "我的建议是调用AI。"}, {"role": "A", "group": false, "action": "", "text": "这主意靠谱。"}, {"role": "E", "group": false, "action": "", "text": "【看手机朗读】“尊敬的领导：首先，衷心感谢您在百忙之中发来亲切的问候。关于本人当前在线状态，现从以下四个维度汇报……”"}, {"role": "B", "group": false, "action": "", "text": "停！领导问你在不在，AI给你写投标书了？"}, {"role": "E", "group": false, "action": "", "text": "它还附了一个风险控制矩阵。"}, {"role": "A", "group": false, "action": "", "text": "删掉删掉！"}, {"role": "B", "group": false, "action": "", "text": "我教你：两个字，“在的”。"}, {"role": "A", "group": false, "action": "", "text": "可“在的”后面要不要加“领导”？"}, {"role": "B", "group": false, "action": "", "text": "加也行。"}, {"role": "A", "group": false, "action": "", "text": "要不要加感叹号？"}, {"role": "B", "group": false, "action": "", "text": "随便！"}, {"role": "A", "group": false, "action": "", "text": "要不要加微笑表情？"}, {"role": "C", "group": false, "action": "", "text": "不行，万一被误解？"}, {"role": "D", "group": false, "action": "", "text": "加握手，表示合作共赢。"}, {"role": "E", "group": false, "action": "", "text": "建议先做A/B测试。"}, {"role": "B", "group": false, "action": "", "text": "领导只有一个人，你准备让谁做B组？"}, {"role": "A", "group": false, "action": "〔点屏幕，松口气〕", "text": "我回了！“在的，领导，请问有什么安排？”"}, {"role": "B", "group": false, "action": "", "text": "这不就解决了吗？"}, {"role": "A", "group": false, "action": "〔盯屏幕〕", "text": "……领导没回。"}, {"role": "C", "group": false, "action": "", "text": "糟了！你是不是回得太慢了？"}, {"role": "D", "group": false, "action": "", "text": "不，这是在酝酿重要任务。"}, {"role": "E", "group": false, "action": "", "text": "目前存在两种可能。"}, {"role": "B", "group": false, "action": "", "text": "什么？"}, {"role": "E", "group": false, "action": "", "text": "领导在忙，或者领导不忙。"}, {"role": "B", "group": false, "action": "", "text": "你这个模型，一点风险都不承担！"}, {"role": "A", "group": false, "action": "〔身子前倾〕", "text": "显示“对方正在输入”了！"}, {"role": "C", "group": false, "action": "", "text": "要来了！"}, {"role": "D", "group": false, "action": "", "text": "好消息要来了！"}, {"role": "E", "group": false, "action": "", "text": "请保持数据采集。"}, {"role": "A", "group": false, "action": "", "text": "……又不输入了。"}, {"role": "B", "group": false, "action": "", "text": "你们几个，把一行输入状态看成股市走势了！"}]}, {"title": "第四场｜提前模拟领导约谈 · 约2分30秒", "lines": [{"role": "B", "group": false, "action": "", "text": "别猜了。你们真这么担心，干脆模拟一下领导可能说什么。"}, {"role": "C", "group": false, "action": "〔挺直站姿，学领导沉稳语气〕", "text": "我先来。"}, {"role": "C", "group": false, "action": "", "text": "小王啊，你入职以来，有没有什么要向我解释的？"}, {"role": "A", "group": false, "action": "〔立正紧张〕", "text": "领导，我……我昨天饭卡刷了两次，不是因为吃了两顿，是第一下没刷上！"}, {"role": "B", "group": false, "action": "", "text": "你自己都给自己定罪了！"}, {"role": "D", "group": false, "action": "〔换成热情表彰语气〕", "text": "不对，真正的领导会这么说。"}, {"role": "D", "group": false, "action": "", "text": "小王啊，经过几天观察，我们发现你特别有潜力！"}, {"role": "A", "group": false, "action": "〔昂首挺胸〕", "text": "谢谢领导！我一定继续努力！"}, {"role": "D", "group": false, "action": "", "text": "所以交给你一项重要任务。"}, {"role": "A", "group": false, "action": "", "text": "我已经准备好了！"}, {"role": "D", "group": false, "action": "", "text": "先把大家的工位分布图整理一下。"}, {"role": "B", "group": false, "action": "", "text": "前面铺垫那么多，就为了画座位表？"}, {"role": "D", "group": false, "action": "", "text": "别小看，管理从空间开始。"}, {"role": "E", "group": false, "action": "〔打开笔记本或手机〕", "text": "这两种模拟都缺少事实依据。我做了一个“入职成果汇报”模板。"}, {"role": "B", "group": false, "action": "", "text": "他才来几天，能有什么成果？"}, {"role": "E", "group": false, "action": "", "text": "成果一：顺利入职。"}, {"role": "B", "group": false, "action": "", "text": "这算什么成果？"}, {"role": "E", "group": false, "action": "", "text": "成果二：参加培训。"}, {"role": "B", "group": false, "action": "", "text": "这不是安排的吗？"}, {"role": "E", "group": false, "action": "", "text": "成果三：成功接收领导消息，并及时反馈。"}, {"role": "B", "group": false, "action": "", "text": "回个“在的”都能写成里程碑？"}, {"role": "E", "group": false, "action": "", "text": "必要时可补充关键指标：响应时间、字数效率、问号识别准确率。"}, {"role": "A", "group": false, "action": "", "text": "那我这几天最大的成果，是成功找到食堂？"}, {"role": "D", "group": false, "action": "", "text": "民以食为天，意义重大！"}, {"role": "C", "group": false, "action": "", "text": "可食堂也有风险！"}, {"role": "B", "group": false, "action": "〔提高音量，停顿〕", "text": "你们给我把食堂放过！"}, {"role": "A", "group": false, "action": "", "text": "不行了，我现在真不知道该怎么办。"}, {"role": "B", "group": false, "action": "", "text": "怎么办？直接问领导！"}, {"role": "C", "group": false, "action": "", "text": "这么直接？"}, {"role": "D", "group": false, "action": "", "text": "这叫主动沟通！"}, {"role": "E", "group": false, "action": "", "text": "属于低成本信息获取策略。"}, {"role": "B", "group": false, "action": "", "text": "你能不能偶尔用人话？"}]}, {"title": "第五场｜谜底竟然是才艺 · 约2分钟", "lines": [{"role": "A", "group": false, "action": "〔手机发送动作〕", "text": "好，我问。领导您好，请问具体有什么安排？"}, {"role": "B", "group": false, "action": "", "text": "这就对了。"}, {"role": "A", "group": false, "action": "〔看屏幕〕", "text": "回了！"}, {"role": "C", "group": false, "action": "", "text": "深呼吸！"}, {"role": "D", "group": false, "action": "", "text": "迎接机会！"}, {"role": "E", "group": false, "action": "", "text": "准备解析文本！"}, {"role": "A", "group": false, "action": "", "text": "【读消息】“听说你们几个新员工挺有才艺，想请你们明天下午活动时表演个节目。”"}, {"role": "C", "group": false, "action": "", "text": "哦——原来不是考勤。"}, {"role": "D", "group": false, "action": "", "text": "我就说组织发现人才了！"}, {"role": "E", "group": false, "action": "", "text": "我的模型也证实了领导有事。"}, {"role": "B", "group": false, "action": "", "text": "你预测“领导有事”，跟预测明天下雨不是晴天有什么区别？"}, {"role": "A", "group": false, "action": "", "text": "等会儿！明天下午表演？现在才通知？"}, {"role": "B", "group": false, "action": "", "text": "怎么了？"}, {"role": "A", "group": false, "action": "", "text": "我会的才艺是解数学题，观众能看十四分钟吗？"}, {"role": "B", "group": false, "action": "", "text": "那得看题目。"}, {"role": "A", "group": false, "action": "", "text": "一道题十四分钟可能只够介绍定义。"}, {"role": "C", "group": false, "action": "", "text": "完了，准备时间不够！"}, {"role": "D", "group": false, "action": "", "text": "不怕！我们有五个人！"}, {"role": "E", "group": false, "action": "", "text": "我建议立刻组建专项小组。"}, {"role": "B", "group": false, "action": "", "text": "你们不是已经在我眼前开了半天会了吗？"}, {"role": "A", "group": false, "action": "", "text": "领导又补了一句：“节目不用太复杂，轻松一点就好。”"}, {"role": "C", "group": false, "action": "", "text": "越说轻松我越紧张。"}, {"role": "D", "group": false, "action": "", "text": "越是轻松越能展现实力。"}, {"role": "E", "group": false, "action": "", "text": "我建议先讨论节目形式、角色划分、风险预案和验收指标。"}, {"role": "B", "group": false, "action": "", "text": "我们只剩一点时间，别再开会讨论怎么开会了！"}]}, {"title": "第六场｜我们演的就是这个 · 约1分30秒", "lines": [{"role": "A", "group": false, "action": "", "text": "那五个人到底能演什么？"}, {"role": "C", "group": false, "action": "", "text": "我负责发现问题。"}, {"role": "D", "group": false, "action": "", "text": "我负责解决情绪问题。"}, {"role": "E", "group": false, "action": "", "text": "我负责把问题写成报告。"}, {"role": "B", "group": false, "action": "", "text": "我负责让他们仨别把事情搞复杂。"}, {"role": "A", "group": false, "action": "", "text": "那我负责什么？"}, {"role": "B", "group": false, "action": "", "text": "你负责收到领导消息！"}, {"role": "A", "group": false, "action": "", "text": "这也算角色？"}, {"role": "B", "group": false, "action": "", "text": "你想啊，刚才我们五个人围绕两个字，说了半天。"}, {"role": "E", "group": false, "action": "", "text": "经过统计，讨论的信息量明显超过原始消息。"}, {"role": "C", "group": false, "action": "", "text": "风险也增加了。"}, {"role": "D", "group": false, "action": "", "text": "节目效果也有了！"}, {"role": "B", "group": false, "action": "〔向观众迈半步〕", "text": "所以我们决定，不编别的，就把这件事原原本本讲给大家听。"}, {"role": "A", "group": false, "action": "", "text": "那我们现在演的就是——"}, {"role": "A", "group": true, "action": "〔五人一起，其他人同说〕", "text": "《领导的“心事”》！"}, {"role": "B", "group": false, "action": "", "text": "领导的心事我们猜不透，但有一件事今天总算明白了。"}, {"role": "A", "group": false, "action": "", "text": "什么？"}, {"role": "B", "group": false, "action": "", "text": "别让脑补，比工作还忙。"}, {"role": "A", "group": false, "action": "", "text": "【手机一响，表情僵住】等会儿，领导又发消息了。"}, {"role": "B", "group": false, "action": "", "text": "这回说什么？"}, {"role": "A", "group": false, "action": "", "text": "还是两个字。"}, {"role": "C", "group": false, "action": "", "text": "坏了！"}, {"role": "D", "group": false, "action": "", "text": "机会来了！"}, {"role": "E", "group": false, "action": "", "text": "准备重新建模！"}, {"role": "B", "group": false, "action": "", "text": "你们仨先别激动！"}, {"role": "A", "group": false, "action": "", "text": "领导说——“在吗？”"}, {"role": "B", "group": false, "action": "〔面向观众〕", "text": "既然领导又问“在吗”，咱们就当着大家的面回一句！"}, {"role": "A", "group": true, "action": "〔五人一起鞠躬〕", "text": "在！我们一直在！谢谢大家！"}]}];
const ROLES={A:'主角·新人小王',B:'同事·小李（控场）',C:'悲观派',D:'乐观派',E:'分析派'};
const $=id=>document.getElementById(id);
const roleEl=$('role'),scriptEl=$('script'),navEl=$('scene-nav');
function getSaved(k,fallback){try{return localStorage.getItem('lx_'+k)??fallback}catch{return fallback}}
function save(k,v){try{localStorage.setItem('lx_'+k,String(v))}catch{}}
const roles=['A','B','C','D','E','ALL'];
let role=getSaved('role','A');if(!roles.includes(role))role='A';
let font=Math.max(15,Math.min(34,Number(getSaved('font',21))||21));
let dark=getSaved('dark','false')==='true';let focus=false;
function element(tag,cl,txt){const e=document.createElement(tag);if(cl)e.className=cl;if(txt!==undefined)e.textContent=txt;return e}
function setup(){SCENES.forEach((sc,si)=>{const section=element('section','scene');section.id='scene-'+(si+1);section.appendChild(element('h2','',sc.title));sc.lines.forEach(l=>{const item=element('article','line');item.dataset.role=l.role;item.dataset.group=l.group?'1':'0';item.appendChild(element('div','speaker',l.role+' · '+ROLES[l.role]+(l.group?' · 全体一起':'')));if(l.action)item.appendChild(element('div','action',l.action));item.appendChild(element('div','words',l.text));section.appendChild(item)});scriptEl.appendChild(section);const a=element('a','','第'+(si+1)+'场');a.href='#scene-'+(si+1);navEl.appendChild(a)});roleEl.value=role;apply()}
function apply(){document.documentElement.style.setProperty('--fz',font+'px');document.body.classList.toggle('dark',dark);document.body.classList.toggle('hide-other',focus&&role!=='ALL');document.querySelectorAll('.line').forEach(e=>{const mine=role!=='ALL'&&(e.dataset.role===role||e.dataset.group==='1');e.classList.toggle('mine',mine);e.classList.toggle('other',role!=='ALL'&&!mine);e.classList.toggle('group',e.dataset.group==='1')});$('mode').textContent=dark?'浅色':'深色';$('focus').textContent='仅看自己：'+(focus?'开':'关');$('focus').disabled=role==='ALL';$('role-note').textContent=role==='ALL'?'当前为完整总览，展示五人的全部对白和动作提示。':'当前角色：'+role+' · '+ROLES[role]+'。绿色为你的台词（含全体齐说），浅色为其他人的接话提示。';}
roleEl.addEventListener('change',()=>{role=roleEl.value;save('role',role);if(role==='ALL')focus=false;apply()});$('minus').addEventListener('click',()=>{font=Math.max(15,font-2);save('font',font);apply()});$('plus').addEventListener('click',()=>{font=Math.min(34,font+2);save('font',font);apply()});$('mode').addEventListener('click',()=>{dark=!dark;save('dark',dark);apply()});$('focus').addEventListener('click',()=>{focus=!focus;apply()});setup();
</script></body></html>
